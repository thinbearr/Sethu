[project]
name = "sethu"
version = "0.1.0"
description = "Multilingual RAG assistant for Indian government schemes, tax and entrepreneurship"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
    "anthropic>=0.40",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-dotenv>=1.0",
    "groq>=0.11",
    "edge-tts>=6.1",
    "ftfy>=6.2",
    "pypdf>=4.0",
    "huggingface_hub>=0.24",
    "numpy",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["sethu*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
